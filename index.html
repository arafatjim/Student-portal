<!DOCTYPE html>
<html lang="en">
<head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
          <script src="https://cdn.tailwindcss.com"></script>
          <link rel="shortcut icon" href="./assets/dcsclogo.jpg" type="image/x-icon">
          <link rel="stylesheet" href="./style/new.css">
          <title>new page</title>
</head>
<body>
          <div class="nav-section grid md:grid-cols-2 lg:grid-cols-1 ">
              <div class="navbar grid grid-cols-2 w-full md:grid-cols-1 lg:grid-cols-1 ">
                        <div class="logo-img flex-1">
                              <img src="./assets/dcsclogo.jpg" alt="">
                              <a class=" ">DELTA COMPUTER SCIENCE COLLEGE,RANGPUR</a>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2">
                          <div class="sign-up-section grid justify-around px-2 ">
                            <button class="btn" onclick="my_modal_2.showModal()">Sign up</button>
                          </div>
                          <div>
                            <button class="btn btn-outline btn-secondary" onclick="my_modal_1.showModal()">Sign in</button>
                           </div>
                        </div>
                              <dialog id="my_modal_2" class="modal ">
                                <div class="modal-box card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
                                  
                                  <form class="registration-form card-body">
                                    <div class="form-control">
                                      <label class="label">
                                        <span class="label-text">Email or Phone:</span>
                                      </label>
                                      <input id="emailNum" type="text" placeholder="Enter your email or phone number" class="input input-bordered" required />
                                    </div>
                                    <!-- subject -->
                                    <div class="form-control">
                                      <label class="label">
                                        <span class="label-text">Subject:</span>
                                      </label>
                                      <select class="subject-selection select select-bordered w-full max-w-xs">
                                        
                                        <option disabled selected>Choose your subject here!</option>
                                        <option>CSE</option>
                                        <option>BBA</option>
                                        <option>MBA</option>
                                        <option>HSC(Science)</option>
                                        <option>HSC(Arts)</option>
                                      </select>
                                    </div>
                        
                                    <!-- session -->
                                    <div class="form-control">
                                      <label class="label">
                                        <span class="label-text">Session:</span>
                                      </label>
                                      <select class="subject-selection select select-bordered w-full max-w-xs">
                                        
                                        <option disabled selected>2024-2025</option>
                                        <option>2023-2024</option>
                                        <option>2022-2023</option>
                                        <option>2021-2022</option>
                                        <option>2020-2021</option>
                                        <option>2019-2020</option>
                                        <option>2018-2019</option>
                                        <option>2017-2018</option>
                                      </select>
                                    </div>
                        
                                    
                                    <div class="form-control">
                                      <label class="label">
                                        <span class="label-text">Create Password:</span>
                                      </label>
                                      <input id="create-pass" type="password" placeholder="Create password" class="input input-bordered" required />
                        
                                      <label class="label">
                                        <span class="label-text">Confirm Password:</span>
                                      </label>
                                      <input id="confirm-pass" type="password" placeholder="Re-enter password" class="input input-bordered" required />
                                      <label class="label">
                                        <a href="#" class="label-text-alt link link-hover">Forgot password?</a>
                                      </label>
                                    </div>
                                    <div class="form-control mt-6">
                                      <button id="btn-sign-up" class="btn btn-primary bg-[#4f57ff]">Sign Up</button>
                                    </div>
                                  </form>
                              
                            </div>
                          </dialog>


                            <dialog id="my_modal_1" class="modal ">
                                      <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
                                        <form class="card-body">
                                          <div class="form-control">
                                            <label class="label">
                                              <span class="label-text">Email</span>
                                            </label>
                                            <input type="email" placeholder="email" class="input input-bordered" required />
                                          </div>
                                          <div class="form-control">
                                            <label class="label">
                                              <span class="label-text">Password</span>
                                            </label>
                                            <input type="password" placeholder="password" class="input input-bordered" required />
                                            <label class="label">
                                              <a href="#" class="label-text-alt link link-hover">Forgot password?</a>
                                            </label>
                                          </div>
                                          <div class="form-control mt-6">
                                            <button id="btn-sign-in" class="btn btn-primary">Sign in</button>
                                          </div>
                                        </form>
                                      </div>
                            </dialog>
              </div>
          </div>
                    
          <main>
            <div class="banner w-full m-0 p-0">
              <img src="./assets/bg.jpg" alt="">
            </div>
          </main>
          <script src="./js/new.js"></script>
</body>
</html>
